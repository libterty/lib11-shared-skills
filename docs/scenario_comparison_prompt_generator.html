<!DOCTYPE html>
<html lang="en" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Comparison Prompt Generator</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.55; color: #263238; background: #f6f5f8; }
        .container { max-width: 1180px; margin: 0 auto; padding: 24px; }
        .panel { background: #fff; border: 1px solid #ddd7e8; border-radius: 8px; padding: 24px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        .header { position: relative; border-bottom: 3px solid #6f42c1; padding-bottom: 14px; }
        h1 { margin: 0; color: #5e35b1; font-size: 2rem; }
        h2 { margin: 0 0 14px; color: #37474f; font-size: 1.25rem; }
        label { display: block; font-weight: 650; margin-bottom: 6px; color: #37474f; }
        input, textarea { width: 100%; border: 1px solid #cfd8dc; border-radius: 6px; padding: 10px; font: inherit; background: #fff; }
        textarea { min-height: 92px; resize: vertical; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .cards, .checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .card, .check { border: 1px solid #ddd7e8; border-radius: 8px; padding: 14px; background: #fff; }
        .card { cursor: pointer; }
        .card.selected { border-color: #6f42c1; background: #f7f2ff; }
        .check { display: flex; gap: 10px; align-items: flex-start; }
        .check input { width: auto; margin-top: 5px; }
        .hint { color: #607d8b; font-size: .95rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
        button { border: 0; border-radius: 6px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: #6f42c1; color: white; }
        button.secondary { background: #455a64; }
        button.ghost { background: #eceff1; color: #263238; }
        .lang-switcher { position: absolute; top: 0; right: 0; display: flex; gap: 6px; }
        .lang-switcher button { background: #fff; color: #6f42c1; border: 1px solid #6f42c1; padding: 6px 12px; border-radius: 18px; }
        .lang-switcher button.active { background: #6f42c1; color: #fff; }
        .output { white-space: pre-wrap; background: #1a1028; color: #f3e5f5; border-radius: 8px; padding: 18px; min-height: 220px; overflow: auto; }
        @media (max-width: 760px) { .container { padding: 12px; } .grid { grid-template-columns: 1fr; } .lang-switcher { position: static; margin-bottom: 12px; justify-content: flex-end; } }
        @media print { .lang-switcher, .actions { display: none; } body { background: #fff; } .panel { box-shadow: none; } .output { color: #000; background: #fff; border: 1px solid #999; } }
    </style>
</head>
<body>
    <main class="container">
        <section class="panel header">
            <div class="lang-switcher"><button id="langEn" onclick="setLanguage('en')">EN</button><button id="langZh" onclick="setLanguage('zh')">中文</button></div>
            <h1>🎯 <span data-i18n="title">Scenario Comparison Prompt Generator</span></h1>
            <p class="hint" data-i18n="intro">Generate an AI prompt for comparing options before an engineering or product decision.</p>
        </section>
        <section class="panel">
            <h2 data-i18n="context">Decision Context</h2>
            <div class="grid">
                <div><label for="topic" data-i18n="topic">Decision topic</label><input id="topic" data-ph="topicPh"></div>
                <div><label for="stakeholders" data-i18n="stakeholders">Stakeholders</label><input id="stakeholders" data-ph="stakeholdersPh"></div>
                <div><label for="timeline" data-i18n="timeline">Timeline</label><input id="timeline" data-ph="timelinePh"></div>
                <div><label for="constraints" data-i18n="constraints">Constraints</label><input id="constraints" data-ph="constraintsPh"></div>
            </div>
            <div style="margin-top:16px"><label for="options" data-i18n="options">Options to compare</label><textarea id="options" data-ph="optionsPh"></textarea></div>
        </section>
        <section class="panel"><h2 data-i18n="decisionType">Decision Type</h2><div class="cards" id="decisionTypes"></div></section>
        <section class="panel"><h2 data-i18n="criteria">Evaluation Criteria</h2><div class="checks" id="criteria"></div></section>
        <section class="panel"><h2 data-i18n="questions">Analysis Questions</h2><div class="checks" id="questions"></div></section>
        <section class="panel">
            <h2 data-i18n="generate">Generate Prompt</h2>
            <div class="actions">
                <button onclick="generatePrompt()" data-i18n="btnGenerate">Generate comparison prompt</button>
                <button class="secondary" onclick="copyOutput()" data-i18n="btnCopy">Copy prompt</button>
                <button class="ghost" onclick="window.print()" data-i18n="btnPrint">Print</button>
                <button class="ghost" onclick="resetForm()" data-i18n="btnReset">Reset</button>
            </div>
            <p class="hint" data-i18n="outputHint">The generated prompt uses the selected language.</p>
            <div class="output" id="output"></div>
        </section>
    </main>
    <script>
        let currentLang = localStorage.getItem('emToolsLang') || 'en';
        let selectedType = 'architecture';
        const data = {
            en: {
                title: 'Scenario Comparison Prompt Generator', pageTitle: 'Scenario Comparison Prompt Generator',
                intro: 'Generate an AI prompt for comparing options before an engineering or product decision.',
                context: 'Decision Context', topic: 'Decision topic', stakeholders: 'Stakeholders', timeline: 'Timeline', constraints: 'Constraints', options: 'Options to compare',
                topicPh: 'e.g. API gateway selection', stakeholdersPh: 'Engineering, SRE, Product, Support', timelinePh: 'Decision by Q2, implementation in Q3', constraintsPh: 'Budget, compliance, existing AWS stack, team expertise', optionsPh: 'Option A: ...\nOption B: ...\nOption C: ...',
                decisionType: 'Decision Type', criteria: 'Evaluation Criteria', questions: 'Analysis Questions', generate: 'Generate Prompt',
                btnGenerate: 'Generate comparison prompt', btnCopy: 'Copy prompt', btnPrint: 'Print', btnReset: 'Reset', outputHint: 'The generated prompt uses the selected language.', copied: 'Copied', empty: 'Generate a prompt first.',
                decisionTypes: [['architecture','Architecture / technical choice','Compare technologies, patterns, migration paths, or platform choices.'],['product','Product / roadmap tradeoff','Compare roadmap scenarios, launch scope, or customer impact.'],['process','Process / operating model','Compare team workflow, ownership, escalation, or support models.'],['investment','Investment / resource allocation','Compare staffing, cost, vendor, or build-vs-buy scenarios.']],
                criteriaItems: ['Business value', 'Customer impact', 'Implementation cost', 'Time to deliver', 'Technical complexity', 'Operational burden', 'Security and compliance', 'Reliability and rollback', 'Team expertise', 'Long-term flexibility', 'Dependency risk', 'Decision reversibility'],
                questionItems: ['What are the strongest arguments for and against each option?', 'Which assumptions would change the recommendation if they are wrong?', 'What are the short-term and long-term tradeoffs?', 'What risks or second-order effects are easy to underestimate?', 'What evidence should we collect before deciding?', 'What recommendation would you make and why?'],
                promptTitle: 'SCENARIO COMPARISON ANALYSIS',
                sections: ['Context', 'Options', 'Evaluation criteria', 'Questions to answer', 'Output format'],
                outputFormat: ['Comparison table with scores and rationale', 'Pros, cons, risks, and mitigations for each option', 'Key assumptions and missing evidence', 'Recommended option with confidence level', 'Next steps and decision owner']
            },
            zh: {
                title: '情境比較 Prompt 產生器', pageTitle: '情境比較 Prompt 產生器',
                intro: '在做工程或產品決策前，產生可貼給 AI 助理的多方案比較 prompt。',
                context: '決策背景', topic: '決策主題', stakeholders: '利害關係人', timeline: '時程', constraints: '限制條件', options: '要比較的選項',
                topicPh: '例如：API Gateway 選型', stakeholdersPh: '工程、SRE、產品、客服', timelinePh: 'Q2 前決策，Q3 導入', constraintsPh: '預算、合規、現有 AWS 架構、團隊熟悉度', optionsPh: '方案 A：...\n方案 B：...\n方案 C：...',
                decisionType: '決策類型', criteria: '評估準則', questions: '分析問題', generate: '產生 Prompt',
                btnGenerate: '產生比較 prompt', btnCopy: '複製 prompt', btnPrint: '列印', btnReset: '重設', outputHint: '產出的 prompt 會依目前選擇的語言生成。', copied: '已複製', empty: '請先產生 prompt。',
                decisionTypes: [['architecture','架構／技術選型','比較技術、設計模式、遷移路徑或平台選擇。'],['product','產品／Roadmap 取捨','比較 roadmap 情境、上線範圍或客戶影響。'],['process','流程／運作模式','比較團隊流程、權責、升級處理或支援模式。'],['investment','投資／資源配置','比較人力、成本、供應商或自建與採購情境。']],
                criteriaItems: ['商業價值', '客戶影響', '導入成本', '交付時間', '技術複雜度', '營運負擔', '安全與合規', '可靠性與回復能力', '團隊熟悉度', '長期彈性', '依賴風險', '決策可逆性'],
                questionItems: ['每個方案最強的支持與反對理由是什麼？', '哪些假設如果錯了會改變建議？', '短期與長期取捨分別是什麼？', '哪些風險或二階效應容易被低估？', '決策前應該先補哪些證據？', '你會建議哪個方案？理由是什麼？'],
                promptTitle: '情境比較分析',
                sections: ['背景', '選項', '評估準則', '需要回答的問題', '輸出格式'],
                outputFormat: ['含分數與理由的比較表', '每個方案的優點、缺點、風險與緩解方式', '關鍵假設與缺少的證據', '建議方案與信心水準', '下一步與決策 owner']
            }
        };
        function t() { return data[currentLang]; }
        function field(id, fallback) { return document.getElementById(id).value.trim() || fallback; }
        function renderChecks(target, items, className, checkedCount) { document.getElementById(target).innerHTML = items.map((text, i) => `<label class="check"><input type="checkbox" class="${className}" ${i < checkedCount ? 'checked' : ''}><span>${text}</span></label>`).join(''); }
        function render() {
            const d = t();
            document.documentElement.lang = currentLang === 'zh' ? 'zh-Hant' : 'en';
            document.title = d.pageTitle;
            document.getElementById('langEn').classList.toggle('active', currentLang === 'en');
            document.getElementById('langZh').classList.toggle('active', currentLang === 'zh');
            document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = d[el.dataset.i18n]);
            document.querySelectorAll('[data-ph]').forEach(el => el.placeholder = d[el.dataset.ph]);
            document.getElementById('decisionTypes').innerHTML = d.decisionTypes.map(([id, title, desc]) => `<div class="card ${id === selectedType ? 'selected' : ''}" onclick="selectType('${id}')"><strong>${title}</strong><br><span class="hint">${desc}</span></div>`).join('');
            renderChecks('criteria', d.criteriaItems, 'criteria-item', 5);
            renderChecks('questions', d.questionItems, 'question-item', 4);
        }
        function setLanguage(lang) { currentLang = lang; localStorage.setItem('emToolsLang', lang); render(); generatePrompt(false); }
        function selectType(type) { selectedType = type; render(); }
        function checkedTexts(selector) { return Array.from(document.querySelectorAll(selector)).filter(x => x.checked).map(x => x.nextElementSibling.textContent); }
        function generatePrompt(show = true) {
            const d = t();
            const typeTitle = d.decisionTypes.find(x => x[0] === selectedType)?.[1] || selectedType;
            const prompt = `${d.promptTitle}: ${field('topic', '[DECISION_TOPIC]')}\n\n## ${d.sections[0]}\n- ${d.topic}: ${field('topic', '[DECISION_TOPIC]')}\n- ${d.decisionType}: ${typeTitle}\n- ${d.stakeholders}: ${field('stakeholders', '[STAKEHOLDERS]')}\n- ${d.timeline}: ${field('timeline', '[TIMELINE]')}\n- ${d.constraints}: ${field('constraints', '[CONSTRAINTS]')}\n\n## ${d.sections[1]}\n${field('options', '[OPTIONS_TO_COMPARE]')}\n\n## ${d.sections[2]}\n${checkedTexts('.criteria-item').map(v => `- ${v}`).join('\n')}\n\n## ${d.sections[3]}\n${checkedTexts('.question-item').map(v => `- ${v}`).join('\n')}\n\n## ${d.sections[4]}\n${d.outputFormat.map(v => `- ${v}`).join('\n')}`;
            document.getElementById('output').textContent = prompt;
            if (show) document.getElementById('output').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
        async function copyOutput() { const out = document.getElementById('output').textContent; if (!out.trim()) return alert(t().empty); await navigator.clipboard.writeText(out); alert(t().copied); }
        function resetForm() { document.querySelectorAll('input[type=text], textarea').forEach(el => el.value = ''); document.getElementById('output').textContent = ''; }
        render();
    </script>
</body>
</html>
