<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scenario Comparison Template</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; line-height: 1.5; color: #263238; background: #f6f5f8; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .panel { background: #fff; border: 1px solid #ddd7e8; border-radius: 8px; padding: 22px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
        .header { position: relative; border-bottom: 3px solid #6f42c1; padding-bottom: 14px; }
        h1 { margin: 0; color: #5e35b1; font-size: 2rem; }
        h2 { margin: 0 0 14px; color: #37474f; font-size: 1.25rem; }
        h3 { margin: 0 0 10px; }
        label { display: block; font-weight: 650; margin-bottom: 6px; }
        input, textarea { width: 100%; border: 1px solid #cfd8dc; border-radius: 6px; padding: 9px; font: inherit; background: #fff; }
        textarea { min-height: 78px; resize: vertical; }
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
        .scenario-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
        .scenario { border: 1px solid #ddd7e8; border-radius: 8px; overflow: hidden; }
        .scenario h3 { background: #6f42c1; color: #fff; padding: 12px; }
        .scenario-body { padding: 12px; }
        .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
        button { border: 0; border-radius: 6px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: #6f42c1; color: white; }
        button.secondary { background: #455a64; } button.ghost { background: #eceff1; color: #263238; }
        .lang-switcher { position: absolute; top: 0; right: 0; display: flex; gap: 6px; }
        .lang-switcher button { background: #fff; color: #6f42c1; border: 1px solid #6f42c1; padding: 6px 12px; border-radius: 18px; }
        .lang-switcher button.active { background: #6f42c1; color: #fff; }
        .hint { color: #607d8b; font-size: .95rem; }
        @media (max-width: 900px) { .container { padding: 12px; } .grid, .scenario-grid { grid-template-columns: 1fr; } .lang-switcher { position: static; justify-content: flex-end; margin-bottom: 12px; } }
        @media print { .lang-switcher, .actions { display: none; } body { background: #fff; } .panel { box-shadow: none; } }
    </style>
</head>
<body>
    <main class="container">
        <section class="panel header">
            <div class="lang-switcher"><button id="langEn" onclick="setLanguage('en')">EN</button><button id="langZh" onclick="setLanguage('zh')">中文</button></div>
            <h1>⚡ <span data-i18n="title">Scenario Comparison Template</span></h1>
            <p class="hint" data-i18n="intro">Use this when you need to compare 2-3 plausible options before making a recommendation.</p>
        </section>
        <section class="panel">
            <h2 data-i18n="context">Decision Context</h2>
            <div class="grid">
                <div><label data-i18n="topic">Decision topic</label><input id="topic" data-ph="topicPh"></div>
                <div><label data-i18n="owner">Decision owner</label><input id="owner" data-ph="ownerPh"></div>
                <div><label data-i18n="deadline">Decision deadline</label><input id="deadline" type="date"></div>
                <div><label data-i18n="stakeholders">Stakeholders</label><input id="stakeholders" data-ph="stakeholdersPh"></div>
            </div>
            <div style="margin-top:14px"><label data-i18n="constraints">Constraints / assumptions</label><textarea id="constraints" data-ph="constraintsPh"></textarea></div>
        </section>
        <section class="panel">
            <h2 data-i18n="options">Scenario Options</h2>
            <div class="scenario-grid" id="scenarioGrid"></div>
        </section>
        <section class="panel">
            <h2 data-i18n="summary">Comparison Summary</h2>
            <div class="grid">
                <div><label data-i18n="bestValue">Best overall value</label><textarea id="bestValue"></textarea></div>
                <div><label data-i18n="lowestRisk">Lowest risk</label><textarea id="lowestRisk"></textarea></div>
                <div><label data-i18n="fastest">Fastest path</label><textarea id="fastest"></textarea></div>
                <div><label data-i18n="recommendation">Recommendation</label><textarea id="recommendation"></textarea></div>
            </div>
        </section>
        <section class="panel">
            <h2 data-i18n="nextSteps">Next Steps</h2>
            <textarea id="nextSteps"></textarea>
            <div class="actions">
                <button onclick="copyTemplate()" data-i18n="btnCopy">Copy structured template</button>
                <button class="secondary" onclick="window.print()" data-i18n="btnPrint">Print / save PDF</button>
                <button class="ghost" onclick="resetForm()" data-i18n="btnReset">Reset</button>
            </div>
        </section>
    </main>
    <script>
        let currentLang = localStorage.getItem('emToolsLang') || 'en';
        const data = {
            en: { title:'Scenario Comparison Template', intro:'Use this when you need to compare 2-3 plausible options before making a recommendation.', context:'Decision Context', topic:'Decision topic', owner:'Decision owner', deadline:'Decision deadline', stakeholders:'Stakeholders', constraints:'Constraints / assumptions', options:'Scenario Options', summary:'Comparison Summary', bestValue:'Best overall value', lowestRisk:'Lowest risk', fastest:'Fastest path', recommendation:'Recommendation', nextSteps:'Next Steps', btnCopy:'Copy structured template', btnPrint:'Print / save PDF', btnReset:'Reset', topicPh:'e.g. Migration strategy for billing service', ownerPh:'Name', stakeholdersPh:'Engineering, Product, Finance, Support', constraintsPh:'Budget, time, staffing, compliance, customer commitments...', copied:'Copied', option:'Option', name:'Name', description:'Description', pros:'Pros', cons:'Cons', risks:'Risks', effort:'Effort / timeline' },
            zh: { title:'情境比較範本', intro:'當你需要比較 2-3 個可行方案並形成建議時使用。', context:'決策背景', topic:'決策主題', owner:'決策 owner', deadline:'決策期限', stakeholders:'利害關係人', constraints:'限制／假設', options:'情境選項', summary:'比較摘要', bestValue:'整體價值最佳', lowestRisk:'風險最低', fastest:'最快路徑', recommendation:'建議方案', nextSteps:'下一步', btnCopy:'複製結構化範本', btnPrint:'列印／存 PDF', btnReset:'重設', topicPh:'例如：Billing service 遷移策略', ownerPh:'姓名', stakeholdersPh:'工程、產品、財務、客服', constraintsPh:'預算、時間、人力、合規、客戶承諾...', copied:'已複製', option:'方案', name:'名稱', description:'描述', pros:'優點', cons:'缺點', risks:'風險', effort:'投入／時程' }
        };
        function t(){return data[currentLang];}
        function setLanguage(lang){currentLang=lang;localStorage.setItem('emToolsLang',lang);render();}
        function renderScenarios(){const d=t();document.getElementById('scenarioGrid').innerHTML=['A','B','C'].map(letter=>`<div class="scenario"><h3>${d.option} ${letter}</h3><div class="scenario-body"><label>${d.name}</label><input id="name${letter}"><label>${d.description}</label><textarea id="desc${letter}"></textarea><label>${d.pros}</label><textarea id="pros${letter}"></textarea><label>${d.cons}</label><textarea id="cons${letter}"></textarea><label>${d.risks}</label><textarea id="risks${letter}"></textarea><label>${d.effort}</label><textarea id="effort${letter}"></textarea></div></div>`).join('');}
        function render(){const d=t();document.documentElement.lang=currentLang==='zh'?'zh-Hant':'en';document.title=d.title;document.getElementById('langEn').classList.toggle('active',currentLang==='en');document.getElementById('langZh').classList.toggle('active',currentLang==='zh');document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=d[el.dataset.i18n]);document.querySelectorAll('[data-ph]').forEach(el=>el.placeholder=d[el.dataset.ph]);const saved=collect();renderScenarios();restore(saved);}
        function val(id){return document.getElementById(id)?.value.trim() || '';}
        function collect(){const out={};document.querySelectorAll('input, textarea').forEach(el=>out[el.id]=el.value);return out;}
        function restore(values){Object.entries(values).forEach(([id,value])=>{const el=document.getElementById(id);if(el)el.value=value;});}
        async function copyTemplate(){const d=t();const scenarios=['A','B','C'].map(l=>`### ${d.option} ${l}: ${val('name'+l)||'['+d.name+']'}\n- ${d.description}: ${val('desc'+l)||'[]'}\n- ${d.pros}: ${val('pros'+l)||'[]'}\n- ${d.cons}: ${val('cons'+l)||'[]'}\n- ${d.risks}: ${val('risks'+l)||'[]'}\n- ${d.effort}: ${val('effort'+l)||'[]'}`).join('\n\n');const text=`# ${d.title}\n\n## ${d.context}\n- ${d.topic}: ${val('topic')||'[]'}\n- ${d.owner}: ${val('owner')||'[]'}\n- ${d.deadline}: ${val('deadline')||'[]'}\n- ${d.stakeholders}: ${val('stakeholders')||'[]'}\n- ${d.constraints}: ${val('constraints')||'[]'}\n\n## ${d.options}\n${scenarios}\n\n## ${d.summary}\n- ${d.bestValue}: ${val('bestValue')||'[]'}\n- ${d.lowestRisk}: ${val('lowestRisk')||'[]'}\n- ${d.fastest}: ${val('fastest')||'[]'}\n- ${d.recommendation}: ${val('recommendation')||'[]'}\n\n## ${d.nextSteps}\n${val('nextSteps')||'[]'}`;await navigator.clipboard.writeText(text);alert(d.copied);}
        function resetForm(){document.querySelectorAll('input, textarea').forEach(el=>el.value='');}
        render();
    </script>
</body>
</html>
